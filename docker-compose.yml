name: ai-content-pipeline-starter

services:
  content-pipeline:
    image: ${DOCKER_IMAGE:-ai-content-pipeline-starter:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-content-pipeline-starter
    restart: unless-stopped
    environment:
      - TZ=${TIMEZONE:-Asia/Jakarta}
      - TIMEZONE=${TIMEZONE:-Asia/Jakarta}
      - CRON_SCHEDULE=${CRON_SCHEDULE:-03:00}         # Jam jalan otomatis dari .env (Default: 03:00 WIB)
      - CRON_MAX_ACCOUNTS=${CRON_MAX_ACCOUNTS:-3}     # Jumlah postingan per hari (Default: 3)
      - RUN_ON_STARTUP=${RUN_ON_STARTUP:-false}       # Jalankan batch saat container startup dari .env (Default: false)
    env_file:
      - .env
    volumes:
      - ./accounts:/app/accounts
      - ./data:/app/data
      - ./output:/app/output
      - ./.env:/app/.env:ro
    # Log rotation agar disk storage VPS tidak penuh oleh docker stdout logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Setting resource limit hemat RAM
    deploy:
      resources:
        limits:
          memory: 250M
